name: CRUX
options:
  bundleIdPrefix: com.matthewpham
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  CRUX:
    type: application
    platform: iOS
    sources:
      - CRUX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpham.crux
        PRODUCT_NAME: CRUX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CRUX.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "CRUX. uses the camera to record beta videos and photos of your climbs."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "CRUX. records audio with your beta videos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "CRUX. attaches photos and videos from your library as beta for a climb."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  CRUXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CRUXTests
    dependencies:
      - target: CRUX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpham.crux.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CRUX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CRUX"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CRUX:
    build:
      targets:
        CRUX: all
        CRUXTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CRUXTests
    run:
      config: Debug
    archive:
      config: Release
